---
name: Deploy FF Bloc documentation to GitHub Pages

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ff-bloc-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt
      - name: Build the FF Bloc documentation
        run: python -m mkdocs build --strict
      - name: Verify the publication artifact
        run: |
          test -f build/pages/index.html
          test -f build/pages/getting-started/index.html
          test -f build/pages/guides/codex-skill/index.html
          grep -Fq 'FF Bloc' build/pages/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
